[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "csp-bot"
authors = [
    {name = "Point72, L.P.", email = "OpenSource@point72.com"},
]
description = "Reactive chat bot framework"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "1.1.0"
requires-python = ">=3.10"
keywords = [
    "csp",
    "stream-processing",
    "slack",
    "telegram",
    "chat",
    "chatbot",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "beautifulsoup4",
    "ccflow>=0.5.2",
    "chatom",
    "croniter",
    "csp>=0.9,<1",
    "csp-gateway>=2.7.1,<2.8",
    "dateparser",
    "hydra-core",
    "pandas",
    "pydantic>=2",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "csp-adapter-discord>=0.2,<0.3",
    "csp-adapter-slack>=0.4,<0.5",
    "csp-adapter-symphony>=0.4,<0.5",
    "csp-adapter-telegram>=0.2.0,<0.3",
    "hatchling",
    "mdformat",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
    # tests
    "tabulate",  # for pandas tests
]

[project.scripts]
csp-bot-start = "csp_bot.cli:main"

[project.urls]
Repository = "https://github.com/Point72/csp-bot"
Homepage = "https://github.com/Point72/csp-bot"

[tool.bumpversion]
current_version = "1.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "csp_bot/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "csp_bot/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 0

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "csp_bot",
]
exclude = [
    "docs",
    "example",
]

[tool.hatch.build.targets.wheel]
packages = [
    "csp_bot",
]
exclude = [
    "docs",
    "example",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "csp_bot/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "csp_bot",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]
"csp_bot/backends" = [
    "F401",
    "F403",
]
